services:
  elan-api:
    build: .
    container_name: elan-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_UPDATE_VERSION_CODE: ${APP_UPDATE_VERSION_CODE:-6}
      APP_UPDATE_VERSION_NAME: ${APP_UPDATE_VERSION_NAME:-0.3.3}
      APP_UPDATE_PUBLIC_BASE_URL: ${APP_UPDATE_PUBLIC_BASE_URL:-https://elan.maxremonnay.fr}
      APP_UPDATE_APK_PATH: /app/updates/elan.apk
      APP_UPDATE_NOTIFY_TOKEN: ${APP_UPDATE_NOTIFY_TOKEN:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
    volumes:
      - ./updates:/app/updates:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      elan-db:
        condition: service_healthy
    networks:
      - elan-internal
      - proxy
    expose:
      - "8080"

  elan-db:
    image: postgres:17-alpine
    container_name: elan-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - elan-postgres:/var/lib/postgresql/data
      - ./src/main/resources/db/migration/V1__create_daily_ideas.sql:/docker-entrypoint-initdb.d/V1__create_daily_ideas.sql:ro
    networks:
      - elan-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  elan-postgres:

networks:
  elan-internal:
    internal: true
  proxy:
    external: true
    name: proxy_shared
